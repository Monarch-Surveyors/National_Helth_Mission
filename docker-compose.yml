services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhm-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhm-frontend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
