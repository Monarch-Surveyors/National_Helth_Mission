services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhm-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8035:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_HOST=host.docker.internal
    env_file:
      - ./backend/.env
    volumes:
      - /var/www/media:/app/media
      - /var/www/static:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhm-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3015:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
